name: NPM Publish Package

on:
  # "published" fires whether a release is created directly or finalized from a
  # draft (softprops/action-gh-release creates a draft, then finalizes it).
  release:
    types: [published]
  # Manual fallback to publish an existing tag, e.g. if a release run was missed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v3.0.0"
        required: true

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish
